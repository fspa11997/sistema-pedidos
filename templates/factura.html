<!-- Sustituye el bloque @page y @media print de tu plantilla factura.html por este bloque.
     Mantiene los estilos de pantalla existentes y corrige exclusivamente la impresión. -->

<style>
/* Tamaño predeterminado para media carta */
@page {
    size: 5.5in 8.5in;
    margin: 4mm;
}

@media print {
    html,
    body {
        box-sizing: border-box !important;
        width: auto !important;
        min-width: 0 !important;
        height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: visible !important;
        background: #fff !important;
        color: #111 !important;
        print-color-adjust: exact !important;
        -webkit-print-color-adjust: exact !important;
    }

    .toolbar,
    .cut-line {
        display: none !important;
    }

    .invoice {
        box-sizing: border-box !important;
        max-width: none !important;
        min-width: 0 !important;
        margin: 0 !important;
        border: 0 !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        overflow: visible !important;
    }

    /* MEDIA CARTA: una copia por página, márgenes uniformes */
    body.modo-media-carta {
        width: 100% !important;
        padding: 0 !important;
        font-family: Arial, sans-serif !important;
        font-size: 10px !important;
        line-height: 1.25 !important;
    }

    body.modo-media-carta .invoice {
        display: block !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        break-inside: avoid !important;
        page-break-inside: avoid !important;
        break-after: page !important;
        page-break-after: always !important;
    }

    body.modo-media-carta .invoice:last-of-type {
        break-after: auto !important;
        page-break-after: auto !important;
    }

    body.modo-media-carta .invoice-header {
        padding: 3mm 0 !important;
        background: #fff !important;
        color: #111 !important;
        border-bottom: 1px solid #243b53 !important;
    }

    body.modo-media-carta .brand-mark {
        display: none !important;
    }

    body.modo-media-carta .brand-name {
        color: #102f50 !important;
        font-size: 15px !important;
    }

    body.modo-media-carta .brand-subtitle,
    body.modo-media-carta .invoice-kicker,
    body.modo-media-carta .invoice-number .date {
        color: #333 !important;
    }

    body.modo-media-carta .invoice-number {
        min-width: 0 !important;
    }

    body.modo-media-carta .invoice-number strong {
        color: #102f50 !important;
        font-size: 17px !important;
    }

    body.modo-media-carta .invoice-body {
        padding: 3mm 0 0 !important;
    }

    body.modo-media-carta .parties {
        grid-template-columns: 1fr 1fr !important;
        gap: 3mm !important;
        margin-top: 3mm !important;
    }

    body.modo-media-carta .info-card {
        padding: 2.5mm !important;
        border: 1px solid #d1d5db !important;
        border-radius: 3px !important;
        break-inside: avoid !important;
    }

    body.modo-media-carta .section-title {
        margin: 3mm 0 1.5mm !important;
        font-size: 8px !important;
    }

    body.modo-media-carta .table-wrap {
        margin-top: 1mm !important;
        overflow: visible !important;
        border-radius: 3px !important;
    }

    body.modo-media-carta table {
        width: 100% !important;
        min-width: 0 !important;
        table-layout: fixed !important;
    }

    body.modo-media-carta th,
    body.modo-media-carta td {
        padding: 2mm 1.5mm !important;
        overflow-wrap: anywhere !important;
    }

    body.modo-media-carta .totals-row {
        margin-top: 3mm !important;
    }

    body.modo-media-carta .totals {
        max-width: 90mm !important;
        padding: 2.5mm 3mm !important;
    }

    body.modo-media-carta .total-line {
        padding: 1mm 0 !important;
    }

    body.modo-media-carta .grand-total {
        margin: 2mm -3mm -2.5mm !important;
        padding: 2.5mm 3mm !important;
        background: #102f50 !important;
        color: #fff !important;
    }

    body.modo-media-carta .footer {
        margin-top: 4mm !important;
        padding-top: 2mm !important;
        font-size: 7.5px !important;
        gap: 4mm !important;
    }

    /* TIRILLA: ancho útil de 76 mm, sin márgenes laterales añadidos por la página */
    body.modo-tirilla {
        width: 76mm !important;
        max-width: 76mm !important;
        margin: 0 !important;
        padding: 0 !important;
        font-family: "Courier New", monospace !important;
        font-size: 9px !important;
        line-height: 1.12 !important;
    }

    body.modo-tirilla .invoice {
        display: block !important;
        width: 76mm !important;
        max-width: 76mm !important;
        min-width: 0 !important;
        height: auto !important;
        min-height: 0 !important;
        max-height: none !important;
        margin: 0 !important;
        padding: 0 !important;
        border: 0 !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        overflow: visible !important;
        break: auto !important;
        page-break-before: auto !important;
        page-break-after: auto !important;
        page-break-inside: auto !important;
    }

    /* La tirilla imprime solo la copia CLIENTE */
    body.modo-tirilla .invoice:nth-of-type(n+2),
    body.modo-tirilla .cut-line {
        display: none !important;
    }

    body.modo-tirilla .invoice-header {
        display: block !important;
        margin: 0 !important;
        padding: 0 0 1.5mm !important;
        text-align: center !important;
        background: #fff !important;
        color: #111 !important;
        border-bottom: 1px dashed #111 !important;
    }

    body.modo-tirilla .brand {
        justify-content: center !important;
    }

    body.modo-tirilla .brand-mark,
    body.modo-tirilla .brand-subtitle,
    body.modo-tirilla .invoice-kicker,
    body.modo-tirilla .copy-label,
    body.modo-tirilla .legal-note,
    body.modo-tirilla .payment-strip {
        display: none !important;
    }

    body.modo-tirilla .brand-name {
        color: #111 !important;
        font: bold 10px "Courier New", monospace !important;
        letter-spacing: 0 !important;
    }

    body.modo-tirilla .invoice-number {
        min-width: 0 !important;
        margin-top: 1mm !important;
        text-align: left !important;
    }

    body.modo-tirilla .invoice-number strong {
        color: #111 !important;
        font-size: 10px !important;
    }

    body.modo-tirilla .invoice-number .date {
        color: #111 !important;
        font-size: 8px !important;
        margin-top: 0.5mm !important;
    }

    body.modo-tirilla .invoice-body {
        margin: 0 !important;
        padding: 0.5mm 0 0 !important;
    }

    body.modo-tirilla .parties {
        display: block !important;
        margin-top: 0.5mm !important;
    }

    body.modo-tirilla .info-card {
        margin: 0 !important;
        padding: 0.8mm 0 !important;
        border: 0 !important;
        border-bottom: 1px dashed #111 !important;
        border-radius: 0 !important;
    }

    body.modo-tirilla .info-card .eyebrow {
        margin-bottom: 0.3mm !important;
        font-size: 8px !important;
    }

    body.modo-tirilla .client-name {
        margin-bottom: 0.3mm !important;
        font-size: 9px !important;
    }

    body.modo-tirilla .info-line {
        margin: 0.3mm 0 !important;
        font-size: 8px !important;
    }

    body.modo-tirilla .section-title {
        margin: 1.5mm 0 0.5mm !important;
        font-size: 8px !important;
        letter-spacing: 0 !important;
    }

    body.modo-tirilla .table-wrap {
        margin: 0 !important;
        border: 0 !important;
        border-radius: 0 !important;
        overflow: visible !important;
    }

    body.modo-tirilla table {
        width: 100% !important;
        min-width: 0 !important;
        table-layout: fixed !important;
        font-family: "Courier New", monospace !important;
    }

    body.modo-tirilla th,
    body.modo-tirilla td {
        padding: 0.7mm 0.2mm !important;
        font-size: 7.5px !important;
        line-height: 1.1 !important;
        color: #111 !important;
        overflow-wrap: anywhere !important;
        border-bottom: 1px dashed #aaa !important;
    }

    body.modo-tirilla th {
        background: #fff !important;
    }

    body.modo-tirilla th:first-child,
    body.modo-tirilla td:first-child { width: 40% !important; }

    body.modo-tirilla th:nth-child(2),
    body.modo-tirilla td:nth-child(2) { width: 14% !important; }

    body.modo-tirilla th:nth-child(3),
    body.modo-tirilla td:nth-child(3) { width: 23% !important; }

    body.modo-tirilla th:nth-child(4),
    body.modo-tirilla td:nth-child(4) { width: 23% !important; }

    body.modo-tirilla .totals-row {
        display: block !important;
        margin: 1mm 0 0 !important;
    }

    body.modo-tirilla .totals {
        width: 100% !important;
        max-width: none !important;
        margin: 0 !important;
        padding: 0.5mm 0 !important;
        border: 0 !important;
        border-top: 1px dashed #111 !important;
        border-radius: 0 !important;
    }

    body.modo-tirilla .total-line {
        padding: 0.5mm 0 !important;
        gap: 1mm !important;
        font-size: 8px !important;
    }

    body.modo-tirilla .grand-total {
        margin: 0.5mm 0 0 !important;
        padding: 1mm 0 !important;
        background: #fff !important;
        color: #111 !important;
        border-top: 1px dashed #111 !important;
        border-bottom: 1px dashed #111 !important;
        border-radius: 0 !important;
    }

    body.modo-tirilla .grand-total strong {
        color: #111 !important;
        font-size: 10px !important;
    }

    /* El agradecimiento es el último elemento impreso: sin margen ni contenido posterior */
    body.modo-tirilla .footer {
        display: block !important;
        margin: 0 !important;
        padding: 0 !important;
        border: 0 !important;
        font-size: 8px !important;
    }

    body.modo-tirilla .thanks {
        display: block !important;
        margin: 0 !important;
        padding: 1mm 0 0 !important;
        text-align: center !important;
        font-size: 8px !important;
        font-weight: 700 !important;
        line-height: 1.1 !important;
        white-space: normal !important;
        color: #111 !important;
    }

    body.modo-tirilla .invoice::after,
    body.modo-tirilla .invoice-body::after,
    body.modo-tirilla .footer::after {
        content: none !important;
        display: none !important;
    }
}
</style>

<script>
(function () {
    let restauracionPendiente = false;

    window.imprimirFactura = function (modo) {
        const esTirilla = modo === 'tirilla';

        document.body.classList.remove('modo-tirilla', 'modo-media-carta');
        document.body.classList.add(esTirilla ? 'modo-tirilla' : 'modo-media-carta');

        let estilo = document.getElementById('st-print-page-size');
        if (!estilo) {
            estilo = document.createElement('style');
            estilo.id = 'st-print-page-size';
            document.head.appendChild(estilo);
        }

        /* Márgenes de página mínimos; la impresora puede imponer un mínimo físico. */
        estilo.textContent = esTirilla
            ? '@page { size: 80mm auto; margin: 0; }'
            : '@page { size: 5.5in 8.5in; margin: 4mm; }';

        restauracionPendiente = true;
        window.setTimeout(function () {
            window.print();
        }, 150);
    };

    window.addEventListener('afterprint', function () {
        if (!restauracionPendiente) return;

        document.body.classList.remove('modo-tirilla', 'modo-media-carta');
        const estilo = document.getElementById('st-print-page-size');
        if (estilo) estilo.textContent = '';
        restauracionPendiente = false;
    });
})();
</script>
