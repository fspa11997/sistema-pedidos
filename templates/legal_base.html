<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f2942">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ST Gestión">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <title>{% block titulo %}{% endblock %} • ST Gestión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0f2942;
      --navy-light: #1e3a5f;
      --blue: #2563eb;
      --blue-hover: #1d4ed8;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --line: #e2e8f0;
      --radius: 16px;
      --shadow-sm: 0 1px 3px rgba(15, 41, 66, 0.06), 0 1px 2px rgba(15, 41, 66, 0.04);
      --shadow-md: 0 12px 30px -6px rgba(15, 41, 66, 0.08), 0 4px 12px -2px rgba(15, 41, 66, 0.04);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14.5px;
      color: var(--text);
      line-height: 1.68;
      -webkit-font-smoothing: antialiased;
    }

    .legal {
      max-width: 840px;
      margin: 0 auto;
      padding: 28px 18px 64px;
    }

    /* TOPBAR */
    .legal-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .brand-mini {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 15px;
      color: var(--navy);
      letter-spacing: 0.01em;
    }

    .brand-mini-badge {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 100%);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.22);
    }

    .volver {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 15px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid #cbd5e1;
      color: var(--navy);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-sm);
      transition: all 0.16s ease;
    }

    .volver:hover {
      background: #f8fafc;
      border-color: var(--navy);
      transform: translateY(-1px);
    }

    /* DOCUMENT CARD */
    .legal-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 36px 40px;
      box-shadow: var(--shadow-md);
    }

    .legal-card h1 {
      margin: 0 0 6px;
      font-size: 26px;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .meta {
      display: inline-block;
      padding: 4px 11px;
      border-radius: 999px;
      background: #f1f5f9;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 22px;
    }

    .legal-card h2 {
      margin: 28px 0 8px;
      padding-top: 18px;
      border-top: 1px solid #f1f5f9;
      font-size: 17px;
      font-weight: 700;
      color: var(--navy);
    }

    .legal-card h2:first-of-type {
      margin-top: 12px;
      padding-top: 0;
      border-top: none;
    }

    .legal-card p {
      margin: 0 0 14px;
      color: #334155;
    }

    .legal-card ul,
    .legal-card ol {
      margin: 0 0 16px;
      padding-left: 20px;
      color: #334155;
    }

    .legal-card li {
      margin-bottom: 6px;
    }

    .legal-card a {
      color: var(--blue);
      font-weight: 600;
      text-decoration: none;
    }

    .legal-card a:hover {
      text-decoration: underline;
    }

    /* FOOTER NAV */
    .nav-legal {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 13px;
      color: var(--muted);
    }

    .nav-legal-links {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-legal-links a {
      padding: 6px 12px;
      border-radius: 8px;
      background: #f8fafc;
      border: 1px solid var(--line);
      color: var(--navy);
      font-weight: 600;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .nav-legal-links a:hover {
      background: #eff6ff;
      border-color: var(--blue);
      color: var(--blue);
      text-decoration: none;
    }

    @media (max-width: 600px) {
      .legal { padding: 16px 12px 44px; }
      .legal-card { padding: 24px 18px; }
      .legal-card h1 { font-size: 22px; }
      .legal-topbar { flex-direction: column-reverse; align-items: stretch; }
      .volver { justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="legal">
    <div class="legal-topbar">
      <div class="brand-mini">
        <div class="brand-mini-badge">ST</div>
        <span>ST GESTIÓN • Marco Legal</span>
      </div>
      <a class="volver" href="{{ url_for('login') }}">← Volver al inicio de sesión</a>
    </div>

    <main class="legal-card">
      {% block contenido %}{% endblock %}

      <div class="nav-legal">
        <span>Documentos legales de ST Gestión</span>
        <div class="nav-legal-links">
          <a href="{{ url_for('terminos') }}">Términos de uso</a>
          <a href="{{ url_for('privacidad') }}">Política de privacidad</a>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
