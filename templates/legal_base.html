<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#102f50">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <title>{% block titulo %}{% endblock %} • ST Gestión</title>
    <style>
        body{margin:0;background:#f3f6fa;font-family:Arial,Helvetica,sans-serif;color:#222;line-height:1.6}
        .legal{max-width:820px;margin:0 auto;padding:28px 20px 60px}
        .legal-card{background:#fff;border-radius:14px;padding:28px 32px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
        h1{margin:0 0 4px;font-size:26px;color:#102f50}
        h2{margin:26px 0 6px;font-size:18px;color:#102f50}
        .meta{color:#777;font-size:13px;margin-bottom:18px}
        a{color:#1366d6}
        .volver{display:inline-block;margin-bottom:14px;font-size:14px}
        .nav-legal{margin-top:28px;font-size:14px;color:#555}
        @media(max-width:500px){.legal-card{padding:20px 18px}}
    </style>
</head>
<body>
<div class="legal">
    <a class="volver" href="{{ url_for('login') }}">← Volver al inicio de sesión</a>
    <div class="legal-card">
        {% block contenido %}{% endblock %}
        <div class="nav-legal">
            <a href="{{ url_for('terminos') }}">Términos de uso</a> ·
            <a href="{{ url_for('privacidad') }}">Política de privacidad</a>
        </div>
    </div>
</div>
</body>
</html>
